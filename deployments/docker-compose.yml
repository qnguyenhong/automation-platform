version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: automation-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automation_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.server
    container_name: automation-server
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/automation_platform?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production"
      JWT_EXPIRY: "24h"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "text"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.worker
    container_name: automation-worker
    environment:
      WORKER_SERVER_URL: "http://server:8080"
      WORKER_NAME: "worker-1"
      WORKER_EXECUTOR_TYPES: "api,e2e,load,unit"
      WORKER_MAX_CONCURRENT: "4"
      WORKER_POLL_INTERVAL: "2s"
      WORKER_HEARTBEAT_INTERVAL: "10s"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "text"
    depends_on:
      - server
    restart: unless-stopped

  frontend:
    build:
      context: ../web
      dockerfile: ../deployments/docker/Dockerfile.web
    container_name: automation-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api/v1"
      VITE_WS_URL: "ws://localhost:8080/api/v1/ws"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
